<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Photo Safe</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;color:#222}
header{background:#111827;color:white;padding:18px 20px;text-align:center}
main{max-width:900px;margin:30px auto;padding:20px}
.card{background:white;border-radius:16px;padding:22px;box-shadow:0 5px 25px #0001}
input,button{padding:12px;border-radius:10px;border:1px solid #ddd;margin:6px 0}
button{background:#111827;color:white;border:0;cursor:pointer}
#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:20px}
.photo{position:relative}.photo img{width:100%;height:160px;object-fit:cover;border-radius:12px}
.photo button{position:absolute;right:5px;top:5px;padding:6px;background:#c00}
#app{display:none}
small{color:#666}
</style>
</head>
<body>
<header><h1>🔐 My Photo Safe</h1><small style="color:#ddd">Private photo gallery</small></header>
<main>
<div id="login" class="card">
<h2>Login</h2>
<p>Demo version — password इसी browser में सुरक्षित रखता है।</p>
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>

<div id="app" class="card">
<h2>📸 मेरी Photos</h2>
<input id="files" type="file" accept="image/*" multiple>
<button onclick="upload()">Photos Add करें</button>
<button onclick="logout()">Logout</button>
<div id="gallery"></div>
</div>
</main>

<script>
const KEY="mps_password", PHOTOS="mps_photos";
if(!localStorage.getItem(KEY)) localStorage.setItem(KEY,"1234");

function login(){
  if(pass.value===localStorage.getItem(KEY)){
    loginBox(false); render();
  } else msg.textContent="गलत password";
}
function loginBox(show){
  document.getElementById("login").style.display=show?"block":"none";
  document.getElementById("app").style.display=show?"none":"block";
}
function logout(){loginBox(true)}
function upload(){
  const arr=JSON.parse(localStorage.getItem(PHOTOS)||"[]");
  [...files.files].forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{arr.push(r.result);localStorage.setItem(PHOTOS,JSON.stringify(arr));render()};
    r.readAsDataURL(f);
  });
}
function render(){
  gallery.innerHTML="";
  JSON.parse(localStorage.getItem(PHOTOS)||"[]").forEach((src,i)=>{
    const d=document.createElement("div");d.className="photo";
    d.innerHTML=`<img src="${src}"><button onclick="del(${i})">×</button>`;
    gallery.appendChild(d);
  });
}
function del(i){
  const a=JSON.parse(localStorage.getItem(PHOTOS)||"[]");a.splice(i,1);
  localStorage.setItem(PHOTOS,JSON.stringify(a));render();
}
</script>
</body>
</html>
